# `docker compose up` builds the image and serves the web app and API on http://localhost:8000.
# Provider settings and keys come from .env (copy .env.example). Bid folders are read from
# ./data/bids; the index, records, traces and model cache persist in the rfp-data volume.
# `docker compose --profile qdrant up` adds a Qdrant server; set RFP_QDRANT_URL=http://qdrant:6333.
services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      RFP_DATA_DIR: /data/bids
    volumes:
      - ./data/bids:/data/bids:ro
      - ./outputs:/data/outputs
      - rfp-data:/data

  qdrant:
    image: qdrant/qdrant:v1.13.4
    profiles: ["qdrant"]
    ports: ["6333:6333"]
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  rfp-data:
  qdrant-data:
