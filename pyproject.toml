[project]
name = "rfp-intel"
version = "0.1.0"
description = "RFP Intelligence Platform: hybrid search and multi-agent field extraction over bid documents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # config, logging, CLI
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "typer>=0.12",
    "pyyaml>=6.0",
    # tracing (OpenTelemetry core; exporters and instrumentors live in the `obs` extra)
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    # parsing
    "pymupdf>=1.24",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    # facts
    "rapidfuzz>=3.10",
    # search
    "qdrant-client>=1.12",
    "fastembed>=0.5",
    # agents
    "anthropic>=0.60",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "tenacity>=9.0",
    # API
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "tzdata>=2026.6",
]

[project.optional-dependencies]
obs = [
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "openinference-instrumentation-anthropic>=0.1",
    "openinference-instrumentation-langchain>=0.1",
]
opensearch = ["opensearch-py>=2.7"]

[project.scripts]
rfp = "rfp_intel.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfp_intel"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH", "N"]
ignore = ["S101"]  # assert is fine in tests and for invariants

[tool.ruff.lint.per-file-ignores]
# Tests hold long literal sentences from real documents; wrapping them hurts readability.
"tests/**" = ["S", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["rfp_intel"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fitz.*", "pymupdf.*", "dateparser.*", "fastembed.*"]
ignore_missing_imports = true

# PyMuPDF ships without type annotations; only the module that wraps it calls it.
[[tool.mypy.overrides]]
module = ["rfp_intel.ingestion.pdf"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not llm and not slow'"
markers = [
    "llm: calls a real LLM API; needs ANTHROPIC_API_KEY",
    "slow: downloads models or processes full bids",
]

[tool.coverage.run]
source = ["rfp_intel"]
