# Retrieval gold set: questions and the passages that answer them.
#
# A passage is a locator, not a chunk id, so labels survive re-chunking:
#   file          case-insensitive substring of the file name
#   must_contain  phrase that must appear in the hit's text (case and whitespace ignored)
#   pages         optional; the hit's page range must include one of them
# match: any  -> the question is answered when any locator is retrieved (default)
# match: all  -> every locator is needed; recall is the share retrieved
# split: dev questions were written alongside the system; heldout questions were written
#   afterwards and not used for any tuning. Both are reported.
#
# Questions are phrased the way a user asks, not copied from the passage.

questions:
  # ---------------------------------------------------------------- Bid1: Dallas ISD JA-207652
  - id: b1-due-final
    bid: Bid1
    split: dev
    question: When is the proposal due now that the addenda have been issued?
    relevant:
      - {file: Addendum 2, must_contain: "July 9, 2024 at 2:00 PM CST"}
      - {file: BidNet, must_contain: "Closing Date: 07/09/2024"}

  - id: b1-due-original
    bid: Bid1
    split: dev
    question: What was the original submission deadline in the RFP?
    relevant:
      - {file: FINAL, must_contain: "Solicitation Due | 27-JUN-2024 14:00:00", pages: [2]}

  - id: b1-prebid
    bid: Bid1
    split: dev
    question: When is the pre-bid meeting and how do vendors attend?
    relevant:
