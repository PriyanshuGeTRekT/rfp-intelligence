      - {file: BidNet, must_contain: "Prebid Conference: 06/10/2024"}

  - id: b1-number
    bid: Bid1
    split: dev
    question: What is the solicitation number for this bid?
    relevant:
      - {file: BidNet, must_contain: "Solicitation Number: JA-207652"}

  - id: b1-term
    bid: Bid1
