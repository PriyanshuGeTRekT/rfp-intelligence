# Expected values for the 20 fields of each provided bid, compiled by hand from the documents.
#
# A field passes when the extracted value meets its rule. Rules are deliberately about the
# substance of the value, not its exact wording, because the same fact can be phrased many ways:
#   patterns        every regex must match the value (case-insensitive; a list is joined)
#   any_patterns    at least one regex must match
#   items           for list fields: each regex must match at least one item
#   instant         the normalized UTC instant must equal this; if the value has a date but no
#                   time, the date alone must match
#   absent          the value must be null (status not_found), or, when or_patterns is given,
#                   a found value that matches one of them (an honest "not specified in the
#                   documents" phrasing counts)
# Sources named here are for the reviewer; the scorer does not check them.

bids:
  Bid1:
    bid_number: {any_patterns: ["JA-207652"]}
    title: {patterns: ["Student and Staff Computing Devices"]}
    due_date: {instant: "2024-07-09T19:00:00Z"}   # Addendum 2: July 9, 2024 2:00 PM Central
    pre_bid_meeting: {instant: "2024-06-10T19:00:00Z"}
    bid_submission_type: {any_patterns: ["isupplier", "electronic", "sealed"]}
    term_of_bid: {patterns: ["3|three", "renew|extension|successive"]}
    bid_bond_requirement: {absent: true, or_patterns: ["not specified", "elsewhere", "not stated"]}
    delivery_date: {absent: true, or_patterns: ["September 2024", "coordinat", "ED ?TECH"]}
    # The RFP states no Net term; its "10 days" is what the prime pays M/WBE subcontractors,
    # so a value quoting it must say so.
    payment_terms: {absent: true, or_patterns: ["firm fixed", "not stated", "subcontract|M/?WBE"]}
    additional_documentation: {items: ["M/?WBE|minority", "W-?9", "1295", "addend"]}
    installation: {patterns: ["white glove|deploy|etch"]}
    mfg_for_registration: {absent: true, or_patterns: ["OEM", "factory", "manufacturer"]}
    contract_or_cooperative: {absent: true, or_patterns: ["interlocal", "EPCNT", "CTPA", "piggyback", "none"]}
    model_no: {absent: true}
    part_no: {absent: true}
    product: {patterns: ["Chromebook", "laptop", "50,?000"]}
    contact_info: {any_patterns: ["Alzate", "JALZATE", "dallasisd"]}
    company_name: {patterns: ["Dallas"]}
    product_specification: {patterns: ["i5|Intel", "16 ?GB", "warranty"]}
    bid_summary: {patterns: ["Dallas", "July 9"]}

  Bid2:
    bid_number: {any_patterns: ["BPM044557", "E20P4600040"]}
    title: {patterns: ["Dell Laptops"]}
    due_date: {instant: "2024-06-10T18:00:00Z"}   # date from the PORFP, 2:00 PM EDT from the portal
    pre_bid_meeting: {absent: true, or_patterns: ["no pre-?bid", "none", "not specified"]}
    bid_submission_type: {patterns: ["eMMA|eMaryland"]}
    # Not a term contract. Quotes must stay valid 90 days (PORFP p2); the 30 days in the Dell
    # quote (Specs p3) is the vendor's own validity, not the requirement.
    term_of_bid: {patterns: ["fixed[- ]?price|purchase order", "90 days|ninety"]}
    bid_bond_requirement: {absent: true, or_patterns: ["not specified", "not stated", "not mentioned"]}
    delivery_date: {patterns: ["45 days"]}
    payment_terms: {patterns: ["10 days", "invoice"]}
    additional_documentation: {items: ["Mercury", "Contract Affidavit", "warrant"]}
    installation: {absent: true, or_patterns: ["not required", "no installation", "not mentioned", "not specified"]}
    mfg_for_registration: {patterns: ["Dell"]}
    contract_or_cooperative: {any_patterns: ["060B5400007", "Master Contract"]}
    model_no: {items: ["Latitude 5550", "WD22TB4"]}
    part_no: {items: ["379-BFNZ", "210-BLYZ"]}
    product: {patterns: ["30", "Latitude 5550", "dock|WD22TB4"]}
    contact_info: {patterns: ["Hawkins", "410-260-7533|thawkins"]}
    company_name: {patterns: ["Treasurer"]}
    product_specification: {patterns: ["Ultra 5|125U", "16 ?GB", "256 ?GB", "3[- ]year"]}
    bid_summary: {patterns: ["Dell", "June 10"]}

  # Unseen bid: Delano Union School District RFP 2025-003, downloaded 2026-11-07 from
  # https://duesd.org/domain/199 after the extraction code was finished; nothing was tuned on
  # it. The main RFP is a 70-page scan (read by OCR); Addendum 1 sets the bid security,
  # Addendum 2 approves a substitute Chromebook. Values compiled by hand from the PDFs.
  Bid3:
    bid_number: {any_patterns: ["2025-003"]}
    title: {patterns: ["Computer Equipment"]}
    due_date: {patterns: ["2024-09-06|September 6, 2024", "13:00|1:00 ?PM"]}  # no zone stated
    pre_bid_meeting: {absent: true, or_patterns: ["none", "no pre", "not "]}
    bid_submission_type: {patterns: ["sealed"]}
    term_of_bid: {patterns: ["12|twelve"]}
    bid_bond_requirement: {patterns: ["10 ?%"]}   # RFP section 4, restated by Addendum 1
    delivery_date: {patterns: ["October 31, 2024|2024-10-31"]}
    payment_terms: {any_patterns: ["invoice", "delivered"]}
    additional_documentation: {items: ["Bid Form", "Non-?Collusion", "Addend"]}
    installation: {absent: true, or_patterns: ["not required", "no installation", "not mentioned", "not specified", "deliver"]}
    mfg_for_registration: {absent: true, or_patterns: ["Dell", "functionally equivalent"]}
    contract_or_cooperative: {any_patterns: ["NASPO", "CMAS", "WSCA", "CALNET"]}
    model_no: {items: ["3120"]}
    part_no: {items: ["9R3B5UT"]}   # the substitute's SKU, from Addendum 2
    product: {patterns: ["Chromebook", "500"]}
    contact_info: {any_patterns: ["Rivera", "srivera"]}
    company_name: {patterns: ["Delano"]}
    product_specification: {patterns: ["N100", "8 ?GB", "64 ?GB"]}
    bid_summary: {patterns: ["Delano", "Chromebook"]}
